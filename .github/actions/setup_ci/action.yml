name: 'Setup Crubit CI'
description: >
  Shared CI setup for every Crubit workflow: a single Google Cloud
  authentication, plus opt-in Bazel Remote Build Execution (RBE), sccache (for
  C++ and/or Rust) and protoc. Replaces the former setup_bazel and
  setup_sccache actions, which each authenticated separately and each carried
  their own copy of the unauthenticated-fork fallback logic.

inputs:
  gcp_sa_key:
    description: >
      Google Cloud service account key JSON used for RBE and cache
      authentication. Empty for pull requests from forks, which have no access
      to secrets; RBE and sccache then degrade to off.
    required: false
    default: ''
  bazel:
    description: 'Install Bazel and configure Remote Build Execution (RBE).'
    required: false
    default: 'false'
  llvm:
    description: >
      Which LLVM revision to build against, by exporting CRUBIT_LLVM_COMMIT to
      override the pin in MODULE.bazel.
        'none'   - do not override; use the MODULE.bazel pin.
        'pinned' - use the commit published once a day by the
                   nightly test matrix job.
    required: false
    default: 'none'
  sccache:
    description: >
      Install sccache and route both C/C++ and Rust compilation through it, by
      exporting the CMake compiler-launcher variables and RUSTC_WRAPPER.
      Requires CARGO_INCREMENTAL=0, which rust.yml sets workflow-wide.

      Both are exported together rather than separately because the two are not
      cleanly separable in practice: the CMake examples use Corrosion, so a
      "C/C++ only" job compiles Rust too. Splitting the toggle would mean a job
      silently caching one language and not the other.
    required: false
    default: 'false'
  protoc:
    description: 'Install a prebuilt protoc and add it to PATH.'
    required: false
    default: 'false'
  protoc_version:
    description: 'protoc release to install when protoc is enabled.'
    required: false
    default: '36.1'

outputs:
  authenticated:
    description: "'true' if Google Cloud credentials were available."
    value: ${{ steps.creds.outputs.authenticated }}
  sccache_enabled:
    description: "'true' if sccache was installed and configured."
    value: ${{ steps.sccache_config.outputs.enabled }}

runs:
  using: 'composite'
  steps:
    # A single authentication shared by every cache below.
    - name: Authenticate to Google Cloud
      id: auth
      if: ${{ inputs.gcp_sa_key != '' }}
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
      with:
        credentials_json: ${{ inputs.gcp_sa_key }}

    - name: Record credential state
      id: creds
      shell: bash
      env:
        GCP_SA_KEY: ${{ inputs.gcp_sa_key }}
      run: |
        if [[ -n "$GCP_SA_KEY" ]]; then
          echo "authenticated=true" >> "$GITHUB_OUTPUT"
        else
          echo "authenticated=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve LLVM commit
      if: ${{ inputs.llvm == 'pinned' }}
      shell: bash
      env:
        # Past this age, a pin that has stopped moving means the nightly
        # update-and-generate job stopped running, not that llvm-project went
        # quiet. Three days spans a long weekend without crying wolf. The age
        # is truncating integer division, so this first warns at 4 days.
        STALE_AFTER_DAYS: '3'
      run: |
        # Published by the nightly test matrix.
        # Prefer a local llvm_commit.txt when checked out on the test-matrix
        # branch so warm-llvm-cache is not served a cached copy by
        # raw.githubusercontent.com's 5-minute CDN. Otherwise fetch from
        # google/crubit (hardcoded so forks and branches build the same LLVM).
        if [[ -f llvm_commit.txt ]]; then
          RAW=$(<llvm_commit.txt)
        else
          RAW=$(curl -fsSL --max-time 30 --retry 3 \
            "https://raw.githubusercontent.com/google/crubit/test-matrix/llvm_commit.txt" || true)
        fi

        # Format is "<sha> <iso8601>". Plain `read` splits on whitespace and
        # absorbs the trailing newline, and leaves PIN_DATE empty if the file
        # is still single-field.
        read -r LLVM_COMMIT PIN_DATE <<< "$RAW"

        # This value is interpolated into a download URL by
        # bazel/llvm_extension.bzl, so anything that is not a bare 40-hex-digit
        # SHA is rejected rather than passed through. Falling back to the
        # MODULE.bazel pin (rather than to llvm-project main) keeps a network
        # blip from turning into an unbudgeted from-source LLVM build.
        if [[ ! "$LLVM_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::warning::No valid LLVM commit published at test-matrix/llvm_commit.txt; using the MODULE.bazel pin."
          exit 0
        fi

        echo "CRUBIT_LLVM_COMMIT=$LLVM_COMMIT" >> "$GITHUB_ENV"

        # Check for a stale LLVM commit pin.
        # Nothing breaks with a stale commit, so without this check we would not know it wasn't
        # getting updated. Our test matrix would silently not update the llvm_commit.txt file.
        AGE_NOTE="published $PIN_DATE"
        STALE=""
        if [[ -z "$PIN_DATE" ]]; then
          STALE="the pin carries no timestamp"
          AGE_NOTE="publication date unknown"
        elif ! PIN_EPOCH=$(date -u -d "$PIN_DATE" +%s 2>/dev/null); then
          STALE="unparseable pin timestamp '$PIN_DATE'"
          AGE_NOTE="publication date unparseable"
        else
          echo "CRUBIT_LLVM_DEV_DATE=$(date -u -d "@$PIN_EPOCH" +%Y%m%d)" >> "$GITHUB_ENV"
          AGE_DAYS=$(( ( $(date -u +%s) - PIN_EPOCH ) / 86400 ))
          AGE_NOTE="published $PIN_DATE (${AGE_DAYS}d ago)"
          if (( AGE_DAYS > STALE_AFTER_DAYS )); then
            STALE="the pin is ${AGE_DAYS} days old"
          fi
        fi

        if [[ -n "$STALE" ]]; then
          echo "::warning::LLVM pin looks stale: ${STALE}. The update-and-generate job on the test-matrix branch may have stopped running, so CI is not exercising recent LLVM."
        fi

        echo "Building against LLVM commit $LLVM_COMMIT ($AGE_NOTE)"
        {
          echo "### LLVM Dependency"
          echo "Building against LLVM commit [\`$LLVM_COMMIT\`](https://github.com/llvm/llvm-project/commit/$LLVM_COMMIT), $AGE_NOTE"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Ensure LLVM tarball is cached in GCS
      if: ${{ inputs.bazel == 'true' && steps.creds.outputs.authenticated == 'true' }}
      shell: bash
      run: |
        COMMIT="${CRUBIT_LLVM_COMMIT:-}"
        if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
          COMMIT=$(sed -nE 's/.*llvm_ext\.configure\(commit = "([0-9a-f]{40})"\).*/\1/p' MODULE.bazel crubit/MODULE.bazel 2>/dev/null | head -n 1)
        fi
        if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::warning::Could not determine LLVM commit to cache in GCS."
          exit 0
        fi

        GCS_HTTPS_URL="https://storage.googleapis.com/crubit-ci-bazel/llvm-project/${COMMIT}.tar.zst"
        GCS_URI="gs://crubit-ci-bazel/llvm-project/${COMMIT}.tar.zst"

        if curl -fsSI --max-time 10 "$GCS_HTTPS_URL" >/dev/null 2>&1; then
          echo "LLVM archive already cached at $GCS_URI"
          exit 0
        fi

        echo "Building stripped LLVM archive for $COMMIT and uploading to $GCS_URI..."
        TMP_DIR=$(mktemp -d)
        trap 'rm -rf "$TMP_DIR"' EXIT

        PREFIX="llvm-project-${COMMIT}"
        curl -fsSL --retry 3 "https://github.com/llvm/llvm-project/archive/${COMMIT}.tar.gz" \
          | tar -xzpf - -C "$TMP_DIR" \
              --exclude='*/test' \
              --exclude='*/tests' \
              --exclude='*/unittests' \
              --exclude='*/docs' \
              --exclude='*/examples' \
              --exclude='*/benchmarks' \
              --exclude="${PREFIX}/utils/bazel/llvm-project-overlay/bolt" \
              --exclude="${PREFIX}/utils/bazel/llvm-project-overlay/compiler-rt" \
              --exclude="${PREFIX}/utils/bazel/llvm-project-overlay/flang" \
              --exclude="${PREFIX}/utils/bazel/llvm-project-overlay/flang-rt" \
              --exclude="${PREFIX}/utils/bazel/llvm-project-overlay/libunwind" \
              --exclude="${PREFIX}/utils/bazel/llvm-project-overlay/lld" \
              --exclude="${PREFIX}/utils/bazel/llvm-project-overlay/lldb" \
              --exclude="${PREFIX}/utils/bazel/llvm-project-overlay/openmp" \
              "${PREFIX}/cmake" \
              "${PREFIX}/llvm" \
              "${PREFIX}/clang" \
              "${PREFIX}/clang-tools-extra" \
              "${PREFIX}/libc" \
              "${PREFIX}/third-party" \
              "${PREFIX}/utils/bazel"

        # llvm/BUILD.bazel and clang/BUILD.bazel load("//mlir:tblgen.bzl", ...),
        # which requires //mlir to be a valid package in the overlay and mlir/
        # to exist as a directory when _overlay_directories calls readdir().
        mkdir -p "${TMP_DIR}/${PREFIX}/mlir"

        # configure.bzl's _overlay_directories calls readdir() on the matching
        # source directory for every directory present in llvm-project-overlay.
        # Prune any overlay directory that does not exist in the stripped tree.
        OVERLAY_DIR="${TMP_DIR}/${PREFIX}/utils/bazel/llvm-project-overlay"
        mapfile -d '' OVERLAY_DIRS < <(find "$OVERLAY_DIR" -mindepth 1 -type d -print0)
        for d in "${OVERLAY_DIRS[@]}"; do
          rel="${d#"${OVERLAY_DIR}/"}"
          if [[ -d "$d" && ! -d "${TMP_DIR}/${PREFIX}/${rel}" ]]; then
            rm -rf "$d"
          fi
        done

        ARCHIVE="${TMP_DIR}/${COMMIT}.tar.zst"
        tar -cf - -C "$TMP_DIR" "$PREFIX" | zstd -T0 -3 -o "$ARCHIVE"
        gcloud storage cp --no-clobber "$ARCHIVE" "$GCS_URI" || true

    - name: Setup Bazel
      if: ${{ inputs.bazel == 'true' }}
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        repository-cache: false
        # Cache extracted toolchains (>10MB), but skip llvm-raw because its
        # revision is overridden dynamically via CRUBIT_LLVM_COMMIT and
        # setup-bazel's prefix restoreKey would otherwise restore a stale
        # 160,000-file tree whenever test-matrix/llvm_commit.txt advances.
        external-cache: |
          manifest:
            +llvm_extension+llvm-raw: false
            rules_crubit++llvm_extension+llvm-raw: false
        disk-cache: false

    # Written to the *home* bazelrc rather than passed per-invocation. Bazel
    # reads $HOME/.bazelrc for every workspace, which matters because
    # examples/build_systems/bazel is a second workspace with its own .bazelrc
    # that would otherwise need a duplicate copy of these flags.
    - name: Configure Bazel RBE
      if: ${{ inputs.bazel == 'true' }}
      shell: bash
      env:
        AUTHENTICATED: ${{ steps.creds.outputs.authenticated }}
      # TODO: Once https://github.com/bazelbuild/bazel/pull/30000 lands in a Bazel release, turn
      # remote compression back on. Without that fix, it causes build failures.
      # echo "build --remote_cache_compression=true"
      run: |
        {
          echo "build --color=yes"
          echo "build --show_timestamps"
        } >> "$HOME/.bazelrc"

        if [[ "$AUTHENTICATED" == "true" ]]; then
          {
            echo "build --remote_executor=grpcs://remotebuildexecution.googleapis.com"
            echo "build --remote_instance_name=projects/crubit-oss-ci-268835/instances/default_instance"
            echo "build --google_default_credentials"
            echo "build --remote_default_exec_properties=OSFamily=Linux"
            echo "build --remote_default_exec_properties=container-image=docker://us-docker.pkg.dev/crubit-oss-ci-268835/ci/rbe-ubuntu2404@sha256:d4b8ad90249585bc240a5db39f68f9b843471737d33c26ae02223568051fae2d"
            echo "build --jobs=50"
          } >> "$HOME/.bazelrc"
          echo "Bazel RBE: enabled"
        else
          # RBE does not support unauthenticated access, so fork PRs build
          # locally on the runner.
          echo "Bazel RBE: disabled (no credentials)"
        fi

    - name: Install sccache
      if: >
        inputs.sccache == 'true'
        && steps.creds.outputs.authenticated == 'true'
      uses: mozilla-actions/sccache-action@65101d47ea8028ed0c98a1cdea8dd9182e9b5133 # v0.0.8

    - name: Configure sccache
      id: sccache_config
      if: ${{ inputs.sccache == 'true' }}
      shell: bash
      env:
        AUTHENTICATED: ${{ steps.creds.outputs.authenticated }}
        CREDS_PATH: ${{ steps.auth.outputs.credentials_file_path }}
      run: |
        if [[ "$AUTHENTICATED" != "true" ]]; then
          # Still define LAUNCHER_FLAGS so the cmake invocation has something to
          # expand to. Note nothing else is exported here: pointing CMake or
          # Cargo at an sccache binary that was never installed would break the
          # build rather than merely skip the cache.
          echo "LAUNCHER_FLAGS=" >> "$GITHUB_ENV"
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "sccache disabled (no credentials)"
          exit 0
        fi

        {
          echo "SCCACHE_GCS_BUCKET=crubit-ci-cmake"
          echo "SCCACHE_GCS_RW_MODE=READ_WRITE"
          echo "SCCACHE_GCS_KEY_PATH=${CREDS_PATH}"
          # One prefix for every consumer. sccache keys are content hashes of
          # (compiler, flags, preprocessed input), so distinct compilers and
          # distinct RUSTFLAGS already occupy distinct key spaces; splitting the
          # prefix would only prevent legitimate sharing.
          echo "SCCACHE_GCS_KEY_PREFIX=sccache/crubit"

          # Both languages, unconditionally. A job that compiles neither is
          # unaffected, since these are only read by cmake and cargo.
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          echo "LAUNCHER_FLAGS=-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          echo "RUSTC_WRAPPER=sccache"
        } >> "$GITHUB_ENV"

        echo "enabled=true" >> "$GITHUB_OUTPUT"

    - name: Cache protoc
      if: ${{ inputs.protoc == 'true' }}
      id: cache_protoc
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/proto
        key: ${{ runner.os }}-protoc-${{ inputs.protoc_version }}

    - name: Install protoc
      if: ${{ inputs.protoc == 'true' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache_protoc.outputs.cache-hit }}
        PROTOC_VER: ${{ inputs.protoc_version }}
        DEST: ${{ runner.temp }}/proto
      run: |
        if [[ "$CACHE_HIT" != "true" ]]; then
          curl -sSLO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VER}/protoc-${PROTOC_VER}-linux-x86_64.zip"
          unzip -o "protoc-${PROTOC_VER}-linux-x86_64.zip" -d "${DEST}"
          rm "protoc-${PROTOC_VER}-linux-x86_64.zip"
        fi
        echo "${DEST}/bin" >> "$GITHUB_PATH"
