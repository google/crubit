name: 'Setup Bazel'
description: 'Sets up Bazel with optional GCP authentication and remote caching'

inputs:
  gcp_sa_key:
    description: 'GCP Service Account Key JSON for remote cache authentication (optional)'
    required: false
    default: ''

outputs:
  rcache_flags:
    description: 'Bazel remote cache flags'
    value: ${{ steps.bazel_cache_flags.outputs.rcache_flags }}

runs:
  using: 'composite'
  steps:
    - name: Authenticate to Google Cloud
      id: auth
      if: ${{ inputs.gcp_sa_key != '' }}
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
      with:
        credentials_json: ${{ inputs.gcp_sa_key }}

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        repository-cache: true
        external-cache: true
        disk-cache: false

    - name: Setup Bazel Remote Cache Flags
      id: bazel_cache_flags
      shell: bash
      env:
        GCP_SA_KEY: ${{ inputs.gcp_sa_key }}
      run: |
        if [[ -n "$GCP_SA_KEY" ]]; then
          FLAGS="--remote_cache=https://storage.googleapis.com/crubit-ci-bazel --google_default_credentials"
          echo "Using GCS Remote Cache (Read-Write)"
        else
          FLAGS="--remote_cache=https://storage.googleapis.com/crubit-ci-bazel --remote_upload_local_results=false"
          echo "Using GCS Remote Cache (Read-Only)"
        fi
        echo "RCACHE_FLAGS=${FLAGS}" >> $GITHUB_ENV
        echo "rcache_flags=${FLAGS}" >> $GITHUB_OUTPUT
