name: Cargo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# LINT.IfChange
jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Cache protoc
      id: cache-protoc
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/proto
        key: ${{ runner.os }}-protoc-36.1
    - name: Install protoc
      env:
        CACHE_HIT: ${{ steps.cache-protoc.outputs.cache-hit }}
      run: |
        if [ "$CACHE_HIT" != "true" ]; then
          PROTOC_VER=36.1
          curl -sSLO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VER}/protoc-${PROTOC_VER}-linux-x86_64.zip"
          unzip -o "protoc-${PROTOC_VER}-linux-x86_64.zip" -d "${{ runner.temp }}/proto"
          rm "protoc-${PROTOC_VER}-linux-x86_64.zip"
        fi
        echo "${{ runner.temp }}/proto/bin" >> $GITHUB_PATH
    - name: Test Cargo project
      run: >
        cargo test --verbose --locked --workspace --no-fail-fast
        --exclude '*_sys'
        --exclude 'rs_bindings_from_cc*'
    - name: Build not-yet-testable Cargo crates
      run: >
        cargo build --verbose --locked --workspace
        --exclude '*_sys'
        --exclude=rs_bindings_from_cc
        --exclude=rs_bindings_from_cc_cc_api
        --exclude=rs_bindings_from_cc_cc_api_ffi
        --exclude=rs_bindings_from_cc_ir_matchers
        --exclude=rs_bindings_from_cc_ir_testing
        --exclude=rs_bindings_from_cc_multiplatform_ir_testing
        --exclude=rs_bindings_from_cc_test_generators

  test_cmake:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [cmake, cmake_demo]

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Setup sccache
      id: sccache
      uses: ./.github/actions/setup_sccache
      with:
        gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
        gcs_key_prefix: sccache/${{ matrix.project }}
    - name: Test CMake project
      run: |
        cd examples/build_systems/${{ matrix.project }}
        cmake -B build -S . $LAUNCHER_FLAGS
        cmake --build build --parallel
        cd build
        ctest --output-on-failure --parallel 2
    - name: Show sccache stats
      if: steps.sccache.outputs.enabled == 'true' && always()
      run: sccache --show-stats

  test_bazel:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Setup Bazel
      uses: ./.github/actions/setup_bazel
      with:
        gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
    - name: Build Bazel test project (example)
      run: |
        cd examples/build_systems/bazel
        bazelisk build ${RCACHE_FLAGS} //:main

    - name: "Build rs_bindings_from_cc using Bazel"
      run: >
        bazelisk build
        --lockfile_mode=error
        --remote_download_outputs=all
        ${RCACHE_FLAGS}
        rs_bindings_from_cc:rs_bindings_from_cc_main
        @protobuf//:protoc

    - name: "Set up Bazel environment for Cargo"
      run: python3 cargo/build/setup_bazel_env.py

    - name: "Build rs_bindings_from_cc using Cargo"
      run: cargo build --verbose --locked -p rs_bindings_from_cc
# LINT.ThenChange(//depot/copy.bara.sky)
