name: Crubit Nightly Test Matrix
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-and-generate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      commit: ${{ steps.llvm.outputs.commit }}
      crubit_commit: ${{ steps.update-crubit.outputs.commit }}
      llvm_matrix: ${{ steps.llvm-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          ref: test-matrix

      - name: Update Crubit Submodule
        id: update-crubit
        run: |
          git submodule update --init --remote crubit
          CRUBIT_COMMIT=$(git -C crubit rev-parse HEAD)
          echo "Updated crubit submodule to $CRUBIT_COMMIT"
          echo "commit=$CRUBIT_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Fetch Versions and Generate Matrix
        id: set-matrix
        run: |
          # Fetch and format the versions into a JSON object
          NIGHTLIES=$(curl -s https://rust-lang.github.io/rustup-components-history/x86_64-unknown-linux-gnu/rustc-dev.json | \
            jq -c 'del(.last_available) | keys | sort | reverse | to_entries | [.[] | {version: ("nightly-" + .value), id: ("nightly-" + (.key | tostring))}]')
          
          STABLES=$(curl -s https://api.github.com/repos/rust-lang/rust/releases | \
            jq -c '[.[].tag_name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | map(split(".") | .[0] + "." + .[1] + ".0") | def distinct: reduce .[] as $x ([]; if index($x) then . else . + [$x] end); distinct | .[:2] | to_entries | [.[] | {version: .value, id: ("stable-" + (.key | tostring))}]')
          
          VERSIONS=$(jq -c -n --argjson n "$NIGHTLIES" --argjson s "$STABLES" '{include: ($n + $s)}')
          
          # Set output for downstream jobs
          echo "matrix=$VERSIONS" >> $GITHUB_OUTPUT
      - name: Resolve llvm-project head
        id: llvm
        run: |
          # We query the bazel build for a commit so we don't hit a commit that otherwise works but has a broken bazel build.
          COMMIT=$(curl -fsSL --max-time 30  "https://buildkite.com/llvm-project/upstream-bazel/builds?branch=main&state=passed" \
                  | grep -oE 'github\.com/llvm/llvm-project/commit/[0-9a-f]{40}' \
                  | head -n 1 | awk -F/ '{print $NF}' || true)
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            COMMIT=$(git ls-remote https://github.com/llvm/llvm-project.git refs/heads/main | cut -f1)
          fi
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve llvm-project head (got '${COMMIT}')"
            exit 1
          fi
          printf '%s %s\n' \
            "$COMMIT" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > llvm_commit.txt
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
      - name: Generate LLVM Matrix
        id: llvm-matrix
        env:
          HEAD: ${{ steps.llvm.outputs.commit }}
          # Lifts the GitHub fallback above the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSIONS=$(jq -c -n --arg head "$HEAD" \
            '{include: [{version: $head, id: "llvm-head", label: ("llvm-" + $head[:8])}]}')

          # If main records the oldest LLVM it supports include it in the matrix,
          # otherwise just build against LLVM head.
          if [[ -f crubit/bazel/llvm_floor.txt ]]; then
            # Comments, whitespace, CRLF endings and blank lines aside, the file
            # holds one full commit.
            FLOOR=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' -e '/^$/d' crubit/bazel/llvm_floor.txt |
              tr 'A-F' 'a-f')
            if [[ ! "$FLOOR" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not read Crubit's LLVM floor (got '${FLOOR}')"
              exit 1
            fi
            VERSIONS=$(jq -c --arg floor "$FLOOR" \
              '.include += [{version: $floor, id: "llvm-floor", label: ("llvm-" + $floor[:8])}]' <<< "$VERSIONS")
          fi

          # Dated once here, so Bazel in each llvm-build job stays offline and
          # we can display that date in the badge.
          DATES='{}'
          for COMMIT in $(jq -r '.include[].version' <<< "$VERSIONS"); do
            # An empty date leaves the lookup to that entry's Bazel.
            if ! DEV_DATE=$(python3 -I crubit/cargo/build/get_llvm_commit_date.py "$COMMIT"); then
              echo "::warning::Could not date LLVM ${COMMIT}; its llvm-build job will look the date up itself."
              DEV_DATE=""
            fi
            DATES=$(jq -c --arg c "$COMMIT" --arg d "$DEV_DATE" '.[$c] = $d' <<< "$DATES")
          done
          VERSIONS=$(jq -c --argjson d "$DATES" '.include |= map(.dev_date = $d[.version])' <<< "$VERSIONS")
          # Label head and floor with the dev date and commit to keep a legible
          # and unambiguous range.
          VERSIONS=$(jq -c '.include |= map(
            if (.id == "llvm-head" or .id == "llvm-floor") and .dev_date != ""
            then .label = "llvm-\(.dev_date[:4])-\(.dev_date[4:6])-\(.dev_date[6:]) (\(.version[:8]))"
            else . end)' <<< "$VERSIONS")

          # Set output for downstream jobs
          echo "matrix=$VERSIONS" >> $GITHUB_OUTPUT

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add crubit llvm_commit.txt
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update crubit and llvm_commit.txt"
            git push origin test-matrix
          fi

  build:
    needs: update-and-generate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.update-and-generate.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          ref: test-matrix

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.version }}
          components: "rust-src, rustc-dev, llvm-tools-preview"

      - name: Build Binary
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.version }}
          RUSTFLAGS: -Awarnings
          # This allows stable Rust versions to use nightly features, which we rely on.
          RUSTC_BOOTSTRAP: 1
        run: |
          cd crubit
          cargo check --bin cc_bindings_from_rs

      - name: Create Badge JSON
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="brightgreen"
          MESSAGE="passing"
          if [ "$STATUS" != "success" ]; then
            COLOR="red"
            MESSAGE="failing"
          fi
          echo "{\"schemaVersion\": 1, \"label\": \"${{ matrix.version }}\", \"message\": \"$MESSAGE\", \"color\": \"$COLOR\"}" > ${{ matrix.id }}.json

      - name: Upload JSON Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: badge-${{ matrix.id }}
          path: ${{ matrix.id }}.json

  upload-badges:
    needs: [update-and-generate, build, llvm-build]
    if: always() && needs.update-and-generate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: test-matrix

      - name: Download all JSON artifacts
        uses: actions/download-artifact@v8
        with:
          path: badges_temp
          pattern: badge-*
          merge-multiple: true

      - name: Push JSONs to target branch
        env:
          MATRIX: ${{ needs.update-and-generate.outputs.matrix }}
          LLVM_MATRIX: ${{ needs.update-and-generate.outputs.llvm_matrix }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          jq -c -n \
            --argjson matrix "$MATRIX" \
            --slurpfile badges <(cat badges_temp/*.json) '
            ($badges | INDEX(.label)) as $by_version |
            $matrix | .include |= map(. + {
              passing: ($by_version[.version].message == "passing")
            })
          ' > matrix.json
          # Read by the entry's id, since head and the floor can share a dev
          # date and so a label. A missing badge counts as failing.
          jq -c '.include[]' <<< "$LLVM_MATRIX" | while read -r ENTRY; do
            BADGE="badges_temp/$(jq -r .id <<< "$ENTRY").json"
            PASSING=false
            if [[ -f "$BADGE" ]] && jq -e '.message == "passing"' "$BADGE" > /dev/null; then
              PASSING=true
            fi
            jq -c --argjson passing "$PASSING" '. + {passing: $passing}' <<< "$ENTRY"
          done | jq -c -s '{include: .}' > llvm_matrix.json

          # A slot with no badge tonight shows grey rather than its last result.
          # One that has never built keeps its "unknown" placeholder.
          for f in llvm-*.json; do
            [[ -e "badges_temp/$f" ]] || jq -e '.message == "unknown"' "$f" > /dev/null ||
              jq -c '.message = "not built" | .color = "lightgrey"' "$f" > "badges_temp/$f"
          done

          mv badges_temp/*.json .
          git add *.json

          if git diff --staged --quiet; then
            echo "No changes in badges."
          else
            git commit -m "chore: update status badges and matrix.json"
            git push origin test-matrix
          fi

      - name: Update latest tag
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CRUBIT_COMMIT: ${{ needs.update-and-generate.outputs.crubit_commit }}
        run: |
          if [[ ! "$CRUBIT_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid Crubit submodule commit SHA: '$CRUBIT_COMMIT'"
            exit 1
          fi
          echo "Updating 'latest' tag to Crubit commit: $CRUBIT_COMMIT"
          gh api -X PATCH "/repos/${{ github.repository }}/git/refs/tags/latest" \
            --field sha="$CRUBIT_COMMIT" --field force=true \
          || gh api -X POST "/repos/${{ github.repository }}/git/refs" \
            --field ref="refs/tags/latest" --field sha="$CRUBIT_COMMIT"

  notify-failures:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: test-matrix
      - name: Report failure in issue
        env:
          GH_TOKEN: ${{ github.token }}
          TEAM_HANDLE: "@google/crubit-readers"
        run: |
          TITLE="🚨 Nightly Test Matrix Failure: $(date +'%Y-%m-%d')"
          
          BODY="Attention $TEAM_HANDLE: The nightly test matrix has failed.

          **Run Details:** [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          gh issue create \
            --title "$TITLE" \
            --body "$BODY" \
            --label "p2,bug,automated-report"

  llvm-build:
    needs: update-and-generate
    runs-on: ubuntu-latest
    # An uncached commit builds LLVM from source. Head pays that once per day,
    # and the floor once each time it moves.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.update-and-generate.outputs.llvm_matrix) }}
    env:
      CRUBIT_LLVM_COMMIT: ${{ matrix.version }}
      CRUBIT_LLVM_DEV_DATE: ${{ matrix.dev_date }}
    steps:
      - name: Checkout test-matrix
        uses: actions/checkout@v6
        with:
          ref: test-matrix
          submodules: true
      # Reuses the same composite action main's CI uses, so the Bazel
      # configuration (and therefore the action cache keys) match.
      - name: Setup CI
        uses: ./crubit/.github/actions/setup_ci
        with:
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
          bazel: 'true'
          llvm: 'none'    # the commit and its date come from the matrix
      - name: Build against ${{ matrix.id }}
        run: |
          cd crubit
          bazelisk build --lockfile_mode=error \
            rs_bindings_from_cc:rs_bindings_from_cc_main

      - name: Create Badge JSON
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="brightgreen"
          MESSAGE="passing"
          if [ "$STATUS" != "success" ]; then
            COLOR="red"
            MESSAGE="failing"
          fi
          echo "{\"schemaVersion\": 1, \"label\": \"${{ matrix.label }}\", \"message\": \"$MESSAGE\", \"color\": \"$COLOR\"}" > ${{ matrix.id }}.json

      - name: Upload JSON Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: badge-${{ matrix.id }}
          path: ${{ matrix.id }}.json

  notify-llvm-failure:
    needs: llvm-build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Report failure in issue
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
          TEAM_HANDLE: "@google/crubit-readers"
        run: |
          TITLE="🚨 LLVM build failure: $(date +'%Y-%m-%d')"
          BODY="Attention $TEAM_HANDLE: building Crubit against one or more LLVM commits failed.

          - **Head:** already published to \`llvm_commit.txt\` on \`test-matrix\`, so PR CI is using it. If this is an upstream breakage, roll back by editing that file to the previous SHA and pushing.
          - **The floor:** Crubit no longer builds against the oldest LLVM that \`bazel/llvm_floor.txt\` claims. Fix Crubit, or raise the floor there if dropping that LLVM is deliberate.

          **Run Details:** [View Workflow Run](<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>)"
          gh issue create \
            --title "$TITLE" \
            --body "$BODY" \
            --label "p2,bug,automated-report"
